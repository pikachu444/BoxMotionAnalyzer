name: Shared core validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test the kernel, public adapter, and FRAME reference profile
        run: |
          python -m pip install numpy pandas scipy pytest jsonschema mujoco==3.6.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path shared-core-evidence | Out-Null
          git rev-parse HEAD | Set-Content shared-core-evidence/checkout-sha.txt
          "${{ github.event.pull_request.head.sha || github.sha }}" | Set-Content shared-core-evidence/public-head-sha.txt
          python -m pytest -q tests/test_shared_time_selection.py tests/test_shared_row_adapter.py tests/test_shared_frame_reference.py tests/test_compare_model.py --junitxml=shared-core-evidence/contracts.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_shared_core_adoption.py | Set-Content shared-core-evidence/adoption.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify independent build and install
        run: python scripts/verify_shared_core_install.py --output shared-core-evidence/isolated-install.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shared-core-evidence
          path: shared-core-evidence
          if-no-files-found: error
