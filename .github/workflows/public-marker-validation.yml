name: Public marker validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-marker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-integration:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # QOpenGLWidget-backed PyVistaQt needs a real Windows Qt platform.
      # The setup action below installs Mesa software OpenGL for the runner.
      QT_QPA_PLATFORM: windows
      QT_OPENGL: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare the Windows software OpenGL driver
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4
        with:
          qt: true
          pyvista: false
          mesa3d-release: '24.3.0'
      - name: Configure the hosted desktop for the release viewport
        shell: powershell
        run: |
          Get-DisplayResolution
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-DisplayResolution
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest mujoco==3.6.0
      - name: Verify the physical Qt desktop before running GUI checks
        run: >-
          python -c "import json; from pathlib import Path; from PySide6.QtGui import QGuiApplication;
          app = QGuiApplication([]); screen = app.primaryScreen(); dpr = screen.devicePixelRatio();
          physical = [screen.size().width() * dpr, screen.size().height() * dpr];
          report = {'physical_size': physical, 'dpr': dpr, 'configured_by_ci': True};
          Path('tmp').mkdir(exist_ok=True);
          Path('tmp/ci-desktop.json').write_text(json.dumps(report), encoding='utf-8');
          print(report); assert physical == [1920, 1080], report"
      - name: Check public geometry, correction, persistence and Qt workflow
        run: >-
          python -m pytest -q --maxfail=1
          tests/test_comparison_layout.py
          tests/test_processing_window_layout.py
          tests/test_marker_face_assignment.py
          tests/test_event_local_marker_review.py
          tests/test_marker_review_lifecycle.py
          tests/test_marker_flip.py
          tests/test_mujoco_marker_fixtures.py
          tests/test_marker_validation.py
          tests/test_continuity_fixtures.py
          tests/test_marker_corruption.py
          tests/test_corruption_export.py
          tests/test_general_export_recovery.py
          tests/test_marker_flip_artifact_io.py
          tests/test_marker_face_gui_flow.py
          tests/test_simulation_contact_gui.py
          tests/test_simulation_layout.py
          tests/test_marker_flip_review_dialog.py
          tests/test_marker_flip_raw_widget.py
          tests/test_compare_model.py
          tests/test_impact_metrics.py
          tests/test_observation_resolution.py
          tests/test_metric_variant_comparison.py
          tests/test_posture_comparison.py
          tests/test_impact_comparison.py
          tests/test_impact_comparison_gui.py
          tests/test_intended_contact.py
          tests/test_contact_comparison.py
          tests/test_contact_comparison_gui.py
          tests/test_artifact_provenance.py
          tests/test_comparison_gui.py
          tests/test_processing_semantics.py
          tests/test_slice_dimension_provenance_gui.py
          tests/test_simulation_export.py
          tests/test_simulation_export_gui.py
          tests/test_simulation_marker_export.py
          tests/test_scene_fixtures.py
          tests/test_scene_detection.py
          tests/test_scene_face_corrections.py
          tests/test_scene_face_corrections_gui.py
          tests/test_support_motion.py
          tests/test_support_cycles.py
          tests/test_support_cycle_workflow.py
          tests/test_scene_artifact_io.py
          tests/test_scene_review_gui.py
          tests/test_scene_workspace.py
          tests/test_scene_workspace_gui.py
          tests/test_scene_trial_record.py
          tests/test_trial_record_integration.py
          tests/test_trial_record_gui.py
          tests/test_processing_window_close.py
          tests/test_result_file_context.py
          tests/test_result_presentation.py
          tests/test_slice_batch_processing.py
          tests/test_workflow_navigation.py
          tests/test_processing_handoff.py
          tests/test_scene_processing_handoff.py
          tests/test_result_format_layout.py
          tests/test_scenario_345.py
          tests/test_scenario_6.py
          tests/test_raw_data_processing.py
          --junitxml=tmp/public-marker-results.xml
      - name: Generate marker observations and open Step 1 at 125 percent
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_simulation_marker_export_gui.py --junitxml=tmp/issue114/gui-125.xml
      - name: Inspect original motion during marker review at 125 percent
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_marker_review_context.py --junitxml=tmp/issue121/context-125.xml
      - name: Verify metric variants in the real comparison GUI at 125 percent
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_metric_variants_gui.py --junitxml=tmp/issue119/gui-125.xml
      - name: Review vertical motion and preserve scene signals at 125 percent
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_scene_signal_gui.py --junitxml=tmp/issue123/gui-125.xml
      - name: Compare repeated posture and public pipeline output at 125 percent
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_posture_comparison_gui.py --junitxml=tmp/issue117/gui-125.xml -o faulthandler_timeout=90
      - name: Check comparison reference labels and shared guide at 125 percent
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_comparison_reference_gui.py --junitxml=tmp/issue122/gui-125.xml -o faulthandler_timeout=90
      - name: Check incomplete pose rows without inferring contact
        run: python -m pytest -q tests/test_drop_posture_post_processor.py -k incomplete_pose --junitxml=tmp/issue115/incomplete.xml
      - name: Verify bounded marker review and real cancellation at 125 percent
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_marker_review_gui.py --junitxml=tmp/issue112/gui-125.xml -o faulthandler_timeout=90
      - name: Replay retained public results in the release GUI at 125 percent
        env:
          QT_SCALE_FACTOR: '1.25'
        shell: pwsh
        run: |
          $trialReports = @(Get-ChildItem -LiteralPath tmp/issue75_trial_gui -Filter execution.json -Recurse -File)
          if ($trialReports.Count -ne 1) { throw 'Expected one retained trial workflow report.' }
          python -m src.simulation.release_gui_validation --trial-report $trialReports[0].FullName --output tmp/issue78_release_gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Summarize required public evidence levels
        if: always()
        run: >-
          python -m src.simulation.public_validation_summary
          --junit tmp/public-marker-results.xml
          --output tmp/public-validation-summary.json --public-required
      - name: Compare independent truth with public observation cases
        shell: pwsh
        run: |
          python -m src.simulation.validate_marker_fixtures --case all --negative-controls --output tmp/ci-free-fall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($markerMotion in @('face', 'edge', 'corner')) {
            foreach ($markerCase in @('healthy', 'x')) {
              python -m src.simulation.validate_marker_fixtures --example 32 --motion $markerMotion --case $markerCase --output "tmp/ci-$markerMotion-$markerCase"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Check independently specified continuity challenges
        run: python -m src.simulation.continuity_fixtures --output tmp/ci-continuity
      - name: Preserve public validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-validation-evidence
          path: |
            tmp/ci-desktop.json
            tmp/issue112/**
            tmp/issue115/**
            tmp/issue114/**
            tmp/issue121/**
            tmp/issue123/**
            tmp/issue117/**
            tmp/issue122/**
            tmp/public-marker-results.xml
            tmp/public-validation-summary.json
            tmp/ci-*/**/validation*.json
            tmp/ci-*/**/negative_controls*.json
            tmp/ci-*/**/*.synthetic.json
            tmp/ci-continuity/**/candidate_evidence.json
            tmp/issue84_public_metrics/**/public_impact_metrics.json
            tmp/issue75_trial_gui/**
            tmp/issue78_release_gui/**
            tmp/issue118/qt_*/**
            tmp/issue119/**
            tmp/issue81_gui/**
            tmp/issue74_gui/**
          if-no-files-found: warn
          retention-days: 30
