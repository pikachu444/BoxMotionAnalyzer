name: Public marker validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-marker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-integration:
    runs-on: windows-latest
    # Preserve all existing checks, with PUB10's additional fresh production cases.
    timeout-minutes: 120
    env:
      # QOpenGLWidget-backed PyVistaQt needs a real Windows Qt platform.
      # The setup action below installs Mesa software OpenGL for the runner.
      QT_QPA_PLATFORM: windows
      QT_OPENGL: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare the Windows software OpenGL driver
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4
        with:
          qt: true
          pyvista: false
          mesa3d-release: '24.3.0'
      - name: Configure the hosted desktop for the release viewport
        shell: powershell
        run: |
          Get-DisplayResolution
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-DisplayResolution
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Verify the validation router
        run: python -m unittest discover -s tests -p test_ci_validation_scope.py
      - name: Select Windows validation scope
        id: validation_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci_validation_scope.py route
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest mujoco==3.6.0
      - name: Record source state before automatic validation
        run: |
          git rev-parse HEAD
          git status --porcelain --untracked-files=all
          git diff --name-only
      - name: Freeze required PUB11 jobs and test populations before execution
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: python -m src.simulation.ci_evidence prepare --output tmp/issue144/frozen-ci
      - name: Verify the physical Qt desktop before running GUI checks
        run: >-
          python -c "import json; from pathlib import Path; from PySide6.QtGui import QGuiApplication;
          app = QGuiApplication([]); screen = app.primaryScreen(); dpr = screen.devicePixelRatio();
          physical = [screen.size().width() * dpr, screen.size().height() * dpr];
          report = {'physical_size': physical, 'dpr': dpr, 'configured_by_ci': True};
          Path('tmp').mkdir(exist_ok=True);
          Path('tmp/ci-desktop.json').write_text(json.dumps(report), encoding='utf-8');
          print(report); assert physical == [1920, 1080], report"
      - name: Check presentation changes at 125 percent
        if: ${{ steps.validation_scope.outputs.scope == 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python scripts/ci_validation_scope.py test-presentation
      # Keep independent validation running; the final evidence gate checks raw outcomes.
      - name: Preserve scene review and render PUB04 at 125 percent
        id: check_01
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: |
          python -m pytest -q tests/test_scene_workflow_gui.py --junitxml=tmp/issue137/gui-125.xml
          $testsFailed = $LASTEXITCODE -ne 0
          python -m src.simulation.scene_review_validation --output tmp/issue137/render-125
          if ($testsFailed -or $LASTEXITCODE -ne 0) { exit 1 }
      - name: Check public geometry, correction, persistence and Qt workflow
        id: check_02
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: >-
          python -m pytest -q
          tests/test_ui_language.py
          tests/test_gui177_common.py
          tests/test_gui_metric_parity_contract.py
          tests/test_gui_metric_parity_exports.py
          tests/test_gui_metric_parity_workflows.py
          tests/test_gui177_step1.py
          tests/test_gui177_flip.py
          tests/test_gui177_processing.py
          tests/test_gui177_results.py
          tests/test_gui177_compare.py
          tests/test_gui177_simulation.py
          tests/test_comparison_layout.py
          tests/test_collinear_profile_recovery.py
          tests/test_marker_profile_identity.py
          tests/test_marker_profile_gui.py
          tests/test_processing_window_layout.py
          tests/test_marker_face_assignment.py
          tests/test_event_local_marker_review.py
          tests/test_marker_review_lifecycle.py
          tests/test_marker_flip.py
          tests/test_mujoco_marker_fixtures.py
          tests/test_marker_validation.py
          tests/test_continuity_fixtures.py
          tests/test_marker_corruption.py
          tests/test_observation_profile.py
          tests/test_observation_integration.py
          tests/test_observation_gui.py
          tests/test_corruption_export.py
          tests/test_general_export_recovery.py
          tests/test_marker_flip_artifact_io.py
          tests/test_marker_face_gui_flow.py
          tests/test_simulation_contact_gui.py
          tests/test_robot_sequence.py
          tests/test_contact_evaluation.py
          tests/test_initial_conditions.py
          tests/test_contact_calibration.py
          tests/test_robot_sequence_gui.py
          tests/test_simulation_layout.py
          tests/test_marker_flip_review_dialog.py
          tests/test_marker_review_layout.py
          tests/test_marker_flip_raw_widget.py
          tests/test_compare_model.py
          tests/test_impact_metrics.py
          tests/test_observation_resolution.py
          tests/test_metric_variant_comparison.py
          tests/test_posture_comparison.py
          tests/test_impact_comparison.py
          tests/test_impact_comparison_gui.py
          tests/test_intended_contact.py
          tests/test_contact_comparison.py
          tests/test_contact_comparison_gui.py
          tests/test_artifact_provenance.py
          tests/test_comparison_gui.py
          tests/test_processing_semantics.py
          tests/test_slice_dimension_provenance_gui.py
          tests/test_simulation_export.py
          tests/test_simulation_mode_profiles.py
          tests/test_simulation_modes_gui.py
          tests/test_simulation_metadata.py
          tests/test_simulation_export_gui.py
          tests/test_simulation_marker_export.py
          tests/test_scene_fixtures.py
          tests/test_scene_detection.py
          tests/test_scene_face_corrections.py
          tests/test_scene_face_corrections_gui.py
          tests/test_support_motion.py
          tests/test_support_cycles.py
          tests/test_support_cycle_workflow.py
          tests/test_scene_artifact_io.py
          tests/test_scene_review_gui.py
          tests/test_scene_workspace.py
          tests/test_scene_workspace_gui.py
          tests/test_scene_workflow_state.py
          tests/test_scene_workflow_gui.py
          tests/test_scene_trial_record.py
          tests/test_trial_record_integration.py
          tests/test_trial_record_gui.py
          tests/test_processing_window_close.py
          tests/test_result_file_context.py
          tests/test_result_presentation.py
          tests/test_slice_batch_processing.py
          tests/test_workflow_navigation.py
          tests/test_processing_handoff.py
          tests/test_scene_processing_handoff.py
          tests/test_result_format_layout.py
          tests/test_scenario_345.py
          tests/test_scenario_6.py
          tests/test_raw_data_processing.py
          tests/test_capture_regression.py
          tests/test_regression_evidence.py
          --junitxml=tmp/public-marker-results.xml
      - name: Execute explicit PUB11 capture tiers with fresh production
        id: check_03
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: |
          python -m src.simulation.capture_corpus --output tmp/issue144/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tierFailed = $false
          foreach ($tier in @('fast', 'capture', 'full')) {
            python -m src.analysis.regression.runner --manifest tmp/issue144/assets/corpus.json --asset-root tmp/issue144/assets --output "tmp/issue144/$tier" --tier $tier
            if ($LASTEXITCODE -ne 0) { $tierFailed = $true }
          }
          python -m src.analysis.regression.runner --manifest tmp/issue144/assets/corpus.json --asset-root tmp/issue144/assets --output tmp/issue144/representative --tier representative --scene tracking_OFF-scene-0
          if ($tierFailed -or $LASTEXITCODE -ne 0) { exit 1 }
      - name: Verify PUB06 mode contracts and independent transforms
        id: check_04
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: python -m src.simulation.mode_validation --output tmp/issue139/contracts
      - name: Verify PUB07 virtual dynamic continuity diagnostics
        id: check_05
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: python -m src.simulation.ci_evidence run --component pub07 --output tmp/issue144/pub07
      - name: Verify PUB08 contacts and production observed event comparisons
        id: check_06
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: python -m src.simulation.ci_evidence run --component pub08 --output tmp/issue144/pub08
      - name: Verify PUB09 seeds, convergence, limited fit and fresh holdout production
        id: check_07
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: python -m src.simulation.ci_evidence run --component pub09 --output tmp/issue144/pub09
      - name: Verify PUB10 virtual visibility and correlated noise through fresh production
        id: check_08
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: python -m src.simulation.ci_evidence run --component pub10 --output tmp/issue144/pub10
      - name: Render PUB07 actual production profiles at 125 percent
        id: check_09
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m src.simulation.robot_ui_validation --output tmp/issue140/production-125
      - name: Render PUB06 production mode settings at original FHD size
        id: check_10
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m src.simulation.mode_ui_validation --output tmp/issue139/production-125
      - name: Generate marker observations and open Step 1 at 125 percent
        id: check_11
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_simulation_marker_export_gui.py --junitxml=tmp/issue114/gui-125.xml
      - name: Verify PUB05 editing and render approved production profiles at 125 percent
        id: check_12
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: |
          python -m pytest -q tests/test_marker_profile_gui.py --junitxml=tmp/issue138/gui-125.xml
          $testsFailed = $LASTEXITCODE -ne 0
          python -m src.simulation.profile_validation --output tmp/issue138/render-125
          if ($testsFailed -or $LASTEXITCODE -ne 0) { exit 1 }
      - name: Inspect original motion during marker review at 125 percent
        id: check_13
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_marker_review_context.py --junitxml=tmp/issue121/context-125.xml
      - name: Inspect responsive marker review labels and controls at 125 percent
        id: check_14
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_marker_review_layout.py --junitxml=tmp/issue136/layout-125.xml
      - name: Verify metric variants in the real comparison GUI at 125 percent
        id: check_15
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_metric_variants_gui.py --junitxml=tmp/issue119/gui-125.xml
      - name: Review vertical motion and preserve scene signals at 125 percent
        id: check_16
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_scene_signal_gui.py --junitxml=tmp/issue123/gui-125.xml
      - name: Compare repeated posture and public pipeline output at 125 percent
        id: check_17
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_posture_comparison_gui.py --junitxml=tmp/issue117/gui-125.xml -o faulthandler_timeout=90
      - name: Check comparison reference labels and shared guide at 125 percent
        id: check_18
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_comparison_reference_gui.py --junitxml=tmp/issue122/gui-125.xml -o faulthandler_timeout=90
      - name: Check incomplete pose rows without inferring contact
        id: check_19
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: python -m pytest -q tests/test_drop_posture_post_processor.py -k incomplete_pose --junitxml=tmp/issue115/incomplete.xml
      - name: Verify bounded marker review and real cancellation at 125 percent
        id: check_20
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python -m pytest -q tests/test_marker_review_gui.py --junitxml=tmp/issue112/gui-125.xml -o faulthandler_timeout=90
      - name: Identify the completed trial for release replay
        id: release_replay_input
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' && hashFiles('tmp/issue75_trial_gui/**/execution.json') != '' }}
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -LiteralPath tmp/issue75_trial_gui -Filter execution.json -Recurse -File)
          if ($reports.Count -ne 1) {
            Write-Warning 'Release replay requires one retained trial workflow report.'
            exit 0
          }
          try {
            $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          } catch {
            Write-Warning 'The retained trial report could not be read; release replay is blocked.'
            exit 0
          }
          if ($report.status -ne 'pass') {
            Write-Warning 'The retained trial did not pass; release replay is blocked.'
            exit 0
          }
          "trial_report=$($reports[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Replay retained public results in the release GUI at 125 percent
        id: check_21
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' && steps.release_replay_input.outputs.trial_report != '' }}
        env:
          QT_SCALE_FACTOR: '1.25'
          TRIAL_REPORT: ${{ steps.release_replay_input.outputs.trial_report }}
        run: python -m src.simulation.ci_evidence run --component gui --trial-report "$env:TRIAL_REPORT" --output tmp/issue144/gui
      - name: Summarize required public evidence levels
        id: check_22
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' && !cancelled() && hashFiles('tmp/public-marker-results.xml') != '' }}
        run: >-
          python -m src.simulation.public_validation_summary
          --junit tmp/public-marker-results.xml
          --output tmp/public-validation-summary.json --public-required
      - name: Compare independent truth with public observation cases
        id: check_23
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        shell: pwsh
        run: |
          python -m src.simulation.validate_marker_fixtures --case all --negative-controls --output tmp/ci-free-fall
          $fixtureFailed = $LASTEXITCODE -ne 0
          foreach ($markerMotion in @('face', 'edge', 'corner')) {
            foreach ($markerCase in @('healthy', 'x')) {
              python -m src.simulation.validate_marker_fixtures --example 32 --motion $markerMotion --case $markerCase --output "tmp/ci-$markerMotion-$markerCase"
              if ($LASTEXITCODE -ne 0) { $fixtureFailed = $true }
            }
          }
          if ($fixtureFailed) { exit 1 }
      - name: Check independently specified continuity challenges
        id: check_24
        continue-on-error: true
        if: ${{ steps.validation_scope.outputs.scope != 'presentation' }}
        run: python -m src.simulation.continuity_fixtures --output tmp/ci-continuity
      - name: Enforce required PUB11 coverage and preserve readable evidence
        if: ${{ always() && steps.validation_scope.outputs.scope != 'presentation' }}
        env:
          PUB11_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: python -m src.simulation.ci_evidence verify --protocol tmp/issue144/frozen-ci/protocol.json --output tmp/issue144/ci-summary --require-step-outcomes
      - name: Record source state after automatic validation
        if: always()
        run: |
          git rev-parse HEAD
          git status --porcelain --untracked-files=all
          git diff --name-only
      - name: Preserve public validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-validation-evidence
          path: |
            tmp/ci-desktop.json
            tmp/ci-presentation.xml
            tmp/issue112/**
            tmp/issue115/**
            tmp/issue114/**
            tmp/issue121/**
            tmp/issue123/**
            tmp/issue117/**
            tmp/issue122/**
            tmp/issue116/**
            tmp/public-marker-results.xml
            tmp/public-validation-summary.json
            tmp/ci-*/**/validation*.json
            tmp/ci-*/**/negative_controls*.json
            tmp/ci-*/**/*.synthetic.json
            tmp/ci-continuity/**/candidate_evidence.json
            tmp/issue84_public_metrics/**/public_impact_metrics.json
            tmp/issue75_trial_gui/**
            tmp/issue78_release_gui/**
            tmp/issue118/qt_*/**
            tmp/issue119/**
            tmp/issue135/**
            tmp/issue136/**
            tmp/issue137/**
            tmp/issue138/**
            tmp/issue139/**
            tmp/issue140/**
            tmp/issue141/**
            tmp/issue142/**
            tmp/issue143/**
            tmp/issue144/**
            tmp/issue81_gui/**
            tmp/issue74_gui/**
          if-no-files-found: warn
          retention-days: 30
