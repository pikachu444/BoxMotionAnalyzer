name: Public marker validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-marker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-integration:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # QOpenGLWidget-backed PyVistaQt needs a real Windows Qt platform.
      # The setup action below installs Mesa software OpenGL for the runner.
      QT_QPA_PLATFORM: windows
      QT_OPENGL: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare the Windows software OpenGL driver
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4
        with:
          qt: true
          pyvista: false
          mesa3d-release: '24.3.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest mujoco==3.6.0
      - name: Check public geometry, correction, persistence and Qt workflow
        run: >-
          python -m pytest -q
          tests/test_marker_face_assignment.py
          tests/test_marker_flip.py
          tests/test_mujoco_marker_fixtures.py
          tests/test_marker_flip_artifact_io.py
          tests/test_marker_face_gui_flow.py
          tests/test_simulation_contact_gui.py
          tests/test_compare_model.py
          tests/test_artifact_provenance.py
          tests/test_comparison_gui.py
          tests/test_processing_semantics.py
          tests/test_slice_dimension_provenance_gui.py
          tests/test_simulation_export.py
          tests/test_simulation_export_gui.py
          --junitxml=tmp/public-marker-results.xml
      - name: Reject missing or skipped required checks
        shell: pwsh
        run: |
          [xml]$markerResults = Get-Content -Raw -LiteralPath tmp/public-marker-results.xml
          $markerSuites = @($markerResults.testsuites.testsuite)
          $markerCount = ($markerSuites | Measure-Object -Property tests -Sum).Sum
          $markerSkipped = ($markerSuites | Measure-Object -Property skipped -Sum).Sum
          if ($markerCount -le 0 -or $markerSkipped -gt 0) {
            throw 'Required public synthetic checks must run without skips.'
          }
          Write-Output 'Public synthetic integration only; not real-capture or ISTA validation.'
      - name: Compare independent truth with public observation cases
        shell: pwsh
        run: |
          python -m src.simulation.validate_marker_fixtures --case all --output tmp/ci-free-fall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($markerMotion in @('face', 'edge', 'corner')) {
            foreach ($markerCase in @('healthy', 'x')) {
              python -m src.simulation.validate_marker_fixtures --example 32 --motion $markerMotion --case $markerCase --output "tmp/ci-$markerMotion-$markerCase"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
