[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bma-shared-core"
version = "0.1.0.dev0"
description = "Policy-free selection of actual recorded samples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["bma_shared_core"]
package-dir = {bma_shared_core = "."}
include-package-data = false
